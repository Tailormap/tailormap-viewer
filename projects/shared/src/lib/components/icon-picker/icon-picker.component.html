<div [class]="getClass()">
  <button mat-flat-button (click)="togglePicker()" cdkOverlayOrigin #iconPickerButton="cdkOverlayOrigin" class="icon-picker__button">
    <span class="icon-picker__toggle icon-picker__toggle--as-polygon">
      @if (selectedIcon) {
        <mat-icon [svgIcon]="selectedIcon"></mat-icon>
      }
    </span>
    <mat-icon svgIcon="chevron_bottom" class="icon-picker__chevron"></mat-icon>
  </button>
</div>

@if (pickerOpen) {
  <tm-popover [origin]="iconPickerButton"
              [width]="51"
              ariaLabel="Icon picker"
              i18n-ariaLabel="@@shared.icon-picker.picker"
              (closed)="pickerOpen = false">
  <div class="icon-picker__picker">
    <div class="icon-picker__icons" [style.color]="getIconColor()">
      @for (icon of icons; track icon) {
        <mat-icon
          [svgIcon]="icon"
          class="icon-picker__icon"
          (click)="selectIcon(icon)"
        [class.mat-elevation-z4]="selectedIcon === icon"></mat-icon>
      }
    </div>
  </div>
  </tm-popover>
}
