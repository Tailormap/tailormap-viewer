<div class="layer-description-dialog-header">
  <h1 mat-dialog-title>{{ data.title }}</h1>
  <button mat-icon-button
          mat-dialog-close
          class="close-button"
          type="button"
          tmTooltip="Close"
          i18n-tmTooltip="@@core.common.close">
    <mat-icon svgIcon="close"></mat-icon>
  </button>
</div>

<mat-dialog-content class="layer-description">
  <div [innerHTML]="data.description | markdownToHtml | async"></div>
</mat-dialog-content>
