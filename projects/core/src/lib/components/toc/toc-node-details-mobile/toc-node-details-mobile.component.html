@if (node) {
  <div class="toc-node-details-in-node">
    @if ((layer?.description || node.metadata?.description); as description) {
      @if (layer?.descriptionInPopup || node.metadata?.descriptionInPopup) {
        <div class="toc-node-description">
          <button mat-flat-button
                  color="primary"
                  type="button"
                  (click)="openDescription(description)"
                  tmTooltip="Show information about {{ getLayerTitle() }}"
                  i18n-tmTooltip="@@core.toc.show-information-about-layer-tooltip"
                  i18n="@@core.toc.show-layer-information">Show information about this layer</button>
        </div>
      } @else {
        <div class="toc-node-description tm-markdown-content" [innerHTML]="description | markdownToHtml | async"></div>
      }
    }
    @if (node.metadata?.id) {
      <div class="toc-node-details-transparency">
        <tm-layer-transparency [layer]="node.metadata.id"></tm-layer-transparency>
      </div>
    }
  </div>
}
