<h2 mat-dialog-title i18n="@@admin-core.form.form-used">Form is used in layers</h2>
<mat-dialog-content>
  <p class="content" i18n="@@admin-core.form.form-used-body">The form {{ data.formName }} is used in the following application layers.</p>
  <ul>
    @for (usage of data.usages; track usage.application.id + '-' + usage.appLayerId) {
      <li>
        <a [routerLink]="getUrl(usage)" (click)="close()">{{ getLabel(usage) }}</a>
      </li>
    }
  </ul>
  <p class="content" i18n="@@admin-core.form.remove-form-from-layers-first">Please select another form or no form for these layers first.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" type="button" (click)="close()" i18n="@@admin-core.common.ok">Ok</button>
</mat-dialog-actions>
