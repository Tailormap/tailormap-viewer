<form [formGroup]="formForm">
  <mat-form-field>
    <mat-label i18n="@@admin-core.common.name">Name</mat-label>
    <input matInput
           tmAutoFocus
           placeholder="Name"
           i18n-placeholder="@@admin-core.common.name"
           formControlName="name"
    />
    @if (formForm.hasError('nonUniqueName')) {
      <mat-hint class="error" i18n="@@admin-core.form.non-unique-name-error">A form with this name already exists for this feature type.</mat-hint>
    }
  </mat-form-field>
  <mat-form-field>
    <mat-label i18n="@@admin-core.common.comments">Comments</mat-label>
    <textarea formControlName="adminComments" matInput></textarea>
  </mat-form-field>
  <div class="form-control">
    <strong i18n="@@admin-core.common.feature-source">Feature source and type</strong>
    <tm-admin-feature-type-selector [featureSourceId]="formForm.get('featureSourceId')?.value"
                                    [featureTypeName]="formForm.get('featureTypeName')?.value"
                                    [disabled]="!!form"
                                    (featureTypeSelected)="updateFeatureTypeSelection($event)"></tm-admin-feature-type-selector>
  </div>
</form>
