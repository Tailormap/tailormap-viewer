@if (featureTypeName) {
  <h2 i18n="@@admin-core.forms.form-fields">Form fields</h2>

  <div class="toolbar">
    <tm-admin-list-filter [formControl]="filter"
                          [filterTerm]="attributeFilter()"
                          label="Filter fields"
                          i18n-label="@@admin-core.form.filter-fields"></tm-admin-list-filter>

    <div class="tab-actions">
      <mat-form-field appearance="fill">
        <mat-label i18n="@@admin-core.form.tab-name">Tab name</mat-label>
        <input matInput [formControl]="tabName" (keyup.enter)="addTab()">
      </mat-form-field>
      <button mat-icon-button color="primary" type="button"
              [disabled]="!tabName.value?.trim()"
              (click)="addTab()"
              [tmTooltip]="getAddTabTooltip()">
        <mat-icon svgIcon="plus"></mat-icon>
      </button>
    </div>
  </div>

  <div class="columns-scroll">
    <div class="columns-row">
      <div cdkDropList
           id="tab-columns"
           class="tab-columns"
           cdkDropListOrientation="horizontal"
           [cdkDropListData]="tabs()"
           (cdkDropListDropped)="onTabDrop($event)">
        @for (tab of tabs(); track tab.id) {
          <div class="column"
               cdkDrag
               cdkDragPreviewContainer="parent"
               cdkDragLockAxis="x"
               [cdkDragData]="tab">
            <div class="column-header"
                 [class.column-header--selected]="selectedTabId() === tab.id"
                 (click)="selectTab(tab.id)">
              <mat-icon svgIcon="folder_filled" class="tab-icon"></mat-icon>
              <span class="label">{{ tab.name }}</span>
              <mat-icon svgIcon="reorder" class="drag-handle" cdkDragHandle></mat-icon>
            </div>
            <div cdkDropList
                 class="field-list"
                 [id]="tab.id"
                 [cdkDropListData]="tabFields().get(tab.id) || []"
                 [cdkDropListConnectedTo]="fieldDropListIds()"
                 (cdkDropListDropped)="onFieldDrop($event)">
              @for (field of tabFields().get(tab.id); track field.name) {
                <div class="field-row"
                     [class.field-row--selected]="field.selected"
                     cdkDrag
                     cdkDragPreviewContainer="parent"
                     [cdkDragData]="field"
                     (click)="selectAttribute(field.name)">
                  <span class="label">{{ field.name }}</span>
                  <mat-icon svgIcon="reorder" class="drag-handle" cdkDragHandle></mat-icon>
                </div>
              }
            </div>
          </div>
        }
      </div>

    </div>
  </div>
}
