@if (tab(); as tab) {
  <form [formGroup]="tabForm">
    <h2 i18n="@@admin-core.form.edit-tab">Edit tab {{ tab.name }}</h2>
    <div class="form-wrapper">
      <mat-form-field>
        <mat-label i18n="@@admin-core.common.name">Name</mat-label>
        <input matInput
               tmAutoFocus
               placeholder="Name"
               i18n-placeholder="@@admin-core.common.name"
               formControlName="name"
        />
      </mat-form-field>
    </div>
  </form>
}
