@let isSaved = isFileSelected();
<div class="form-field">
  <div class="upload-wrapper" [class.upload-complete]="isSaved">
    <input type="file" #fileInput
      [accept]="acceptedFileTypes().join(',')"
      (change)="fileChangeEvent($event)"
      class="fileInputProfile">
    @if (isSaved) {
      <button mat-stroked-button
        color="warn"
        tmTooltip="Clear file"
        i18n-tmTooltip="@@admin-core.application.clear-file-upload"
        (click)="fileInput.value = ''; emitClear()">
        <mat-icon svgIcon="trash_filled"></mat-icon>
      </button>
    }
  </div>
</div>
