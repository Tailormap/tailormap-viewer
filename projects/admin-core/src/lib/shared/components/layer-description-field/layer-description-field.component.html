<div class="layer-description-field"
     [attr.inert]="disabled() ? '' : null"
     [class.disabled]="disabled()"
     (focusin)="onInteraction()"
     (focusout)="onTouched?.()">
  <strong class="layer-description-label" [id]="labelId" i18n="@@admin-core.common.description">Description</strong>
  <tm-markdown-editor [content]="content()"
                      [insertUpload$]="selectUpload$"
                      [uploadService$]="uploadImage$"
                      [ariaLabelledBy]="labelId"
                      (contentChanged)="onContentChanged($event)"></tm-markdown-editor>
  <div class="layer-description-hint">
    <ng-content select="tm-admin-layer-description-field-hint"/>
  </div>
</div>
