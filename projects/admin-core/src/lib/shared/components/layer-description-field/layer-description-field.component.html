
<mat-form-field>
  <mat-label i18n="@@admin-core.common.description">Description</mat-label>
  <textarea #area matInput
            [formControl]="textareaControl"
            placeholder="Description"
            i18n-placeholder="@@admin-core.common.description"
            (blur)="onTouched()"
            [cdkTextareaAutosize]="true"
            cdkAutosizeMinRows="4"
            cdkAutosizeMaxRows="10"></textarea>
  <button type="button" mat-icon-button matSuffix i18n-matTooltip="@@admin-core.catalog.description.insert-upload.icon-button" matTooltip="Insert image or link to file" (click)="addLink()">
    <mat-icon svgIcon="plus"></mat-icon>
  </button>
  <mat-hint>
    <ng-content select="tm-admin-layer-description-field-hint"/>
  </mat-hint>
</mat-form-field>
