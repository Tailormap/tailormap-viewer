@let selected = selectedFile();
@if (selected !== null) {
  <div class="current-image">
    <img [src]="getUrl(selected)" alt=""/>
  </div>
}

<div class="buttons">
  <button mat-flat-button
          color="primary"
          (click)="selectFile()">{{ getSelectButtonTitle() }}</button>

  @if (selectedFile !== null) {
    <button mat-flat-button (click)="clear()" i18n="@@admin-core.common.clear">Clear</button>
  }
</div>
